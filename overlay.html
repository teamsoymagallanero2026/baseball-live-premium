<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay Team Soy Magallanero — V4.5</title>
  <link rel="stylesheet" href="overlay.css?v=4.5.0" />
</head>
<body>
  <main class="broadcast-frame" aria-label="Overlay vertical de béisbol en vivo">

    <!--
      V4.5: sin marcos para cámara ni comentaristas.
      El overlay permanente se concentra únicamente en el marcador.
      Regla: VISITANTE izquierda / HOME derecha.
    -->

    <!-- Solo visible con /overlay?guides=1 -->
    <div class="chat-safe-zone" aria-hidden="true"><span>ZONA LIBRE PARA CHAT</span></div>

    <section class="scorebug scorebug-premium" id="scorebug">
      <div class="orbit-deco orbit-one"></div>
      <div class="orbit-deco orbit-two"></div>
      <div class="glass-sheen"></div>

      <div class="scorebug-topbar">
        <div class="broadcast-brand">
          <img class="brand-mark" src="./assets/team-soy-magallanero-mark.png" alt="" />
          <div class="brand-copy">
            <span class="brand-kicker"><i class="live-dot"></i>EN VIVO</span>
            <strong>TEAM SOY MAGALLANERO</strong>
          </div>
        </div>

        <div class="inning-pill" aria-label="Inning actual">
          <span id="halfArrow">▲</span>
          <span id="halfLabel">ALTA</span>
          <strong id="inningNumber">1</strong>
        </div>
      </div>

      <div class="scorebug-main">
        <!-- VISITANTE SIEMPRE A LA IZQUIERDA -->
        <article class="team-side team-away is-magallanes" id="awayCard">
          <div class="team-role">VISITANTE</div>
          <div class="team-head">
            <div class="team-logo-shell has-logo">
              <img id="awayLogo" class="team-logo" src="./assets/magallanes.png" alt="Logo visitante" />
              <span id="awayBadge" class="team-logo-fallback">MAG</span>
            </div>
            <div class="team-copy">
              <div class="team-short" id="awayShort">MAG</div>
              <div class="team-name" id="awayName">MAGALLANES</div>
            </div>
          </div>

          <div class="score-zone">
            <div class="team-score" id="awayRuns">0</div>
            <div class="rhe-row" aria-label="Carreras hits errores visitante">
              <span><small>R</small><b id="awayR">0</b></span>
              <span><small>H</small><b id="awayH">0</b></span>
              <span><small>E</small><b id="awayE">0</b></span>
            </div>
          </div>
        </article>

        <!-- CENTRO DE JUEGO -->
        <div class="center-panel">
          <div class="batting-pill"><span class="batting-dot"></span>BATEA <strong id="battingTeam">MAGALLANES</strong></div>

          <div class="diamond-wrap" aria-label="Corredores en bases">
            <div class="diamond-lines"></div>
            <div class="base second" id="baseSecond"><span>2</span></div>
            <div class="base third" id="baseThird"><span>3</span></div>
            <div class="base first" id="baseFirst"><span>1</span></div>
            <div class="home-plate"></div>
          </div>

          <div class="count-panel" aria-label="Bolas strikes outs">
            <div class="count-line balls-line">
              <span class="count-letter">B</span>
              <i data-ball="1"></i><i data-ball="2"></i><i data-ball="3"></i>
            </div>
            <div class="count-line strikes-line">
              <span class="count-letter">S</span>
              <i data-strike="1"></i><i data-strike="2"></i>
            </div>
            <div class="count-line outs-line">
              <span class="count-letter">O</span>
              <i data-out="1"></i><i data-out="2"></i>
            </div>
          </div>
        </div>

        <!-- HOME CLUB SIEMPRE A LA DERECHA -->
        <article class="team-side team-home" id="homeCard">
          <div class="team-role">HOME CLUB</div>
          <div class="team-head team-head-right">
            <div class="team-copy team-copy-right">
              <div class="team-short" id="homeShort">RIV</div>
              <div class="team-name" id="homeName">RIVAL</div>
            </div>
            <div class="team-logo-shell">
              <img id="homeLogo" class="team-logo" alt="Logo home club" />
              <span id="homeBadge" class="team-logo-fallback">RIV</span>
            </div>
          </div>

          <div class="score-zone score-zone-right">
            <div class="rhe-row" aria-label="Carreras hits errores home club">
              <span><small>R</small><b id="homeR">0</b></span>
              <span><small>H</small><b id="homeH">0</b></span>
              <span><small>E</small><b id="homeE">0</b></span>
            </div>
            <div class="team-score" id="homeRuns">0</div>
          </div>
        </article>
      </div>

      <div class="scorebug-bottombar">
        <div class="last-play-label">ÚLTIMA JUGADA</div>
        <div class="last-play" id="lastPlay">PLAY BALL</div>
        <div class="status-chip" id="connectionStatus">CONECTANDO</div>
      </div>
    </section>

    <section class="fx-layer" id="fxLayer" aria-live="polite">
      <div class="fx-orbit"></div>
      <div class="fx-glow"></div>
      <div class="fx-text" id="fxText">HOME RUN</div>
    </section>
  </main>

  <script>
    function fitOverlayCanvas() {
      const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
      document.documentElement.style.setProperty("--overlay-scale", String(scale));
    }
    fitOverlayCanvas();
    window.addEventListener("resize", fitOverlayCanvas, { passive: true });
  </script>
  <script type="module" src="overlay.js?v=4.5.0"></script>
</body>
</html>
